    <!-- ===== MAIN CONTENT ===== -->
    <main>


        <section class="kontakt">
            <div class="container">
                <h2>Kontakt</h2>

                <form class="kontakt_grid">

                    <div class="kontakt_grid_1-1">

                        <div class="form-group">
                            <input type="text" id="name" name="name" placeholder="Navn" required>
                        </div>

                        <div class="form-group">
                            <input type="email" id="email" name="email" placeholder="E-mail *" required>
                        </div>

                    </div>

                    <div class="form-group">
                        <input type="tel" id="phone" name="phone" placeholder="Telefonnummer">
                    </div>

                    <div class="form-group">
                        <textarea id="message" name="message" placeholder="Besked" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="btn">
                        Send
                    </button>

                </form>

            </div>
        </section>
    </main>
